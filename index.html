<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mxlauncher — soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #0e1118;
      position: relative;
      cursor: default;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .grain-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='grain'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.22' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23grain)'/%3E%3C/svg%3E");
      background-size: 260px 260px;
      background-repeat: repeat;
      mix-blend-mode: overlay;
    }

    .convex-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      box-shadow:
        inset 0 0 25px 4px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.05);
      background: radial-gradient(ellipse at 50% 50%,
          transparent 65%,
          rgba(0, 0, 0, 0.12) 85%,
          rgba(0, 0, 0, 0.40) 100%);
    }

    .soon-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      pointer-events: none;
      text-align: center;
    }

    .soon-text {
      font-size: clamp(64px, 14vw, 160px);
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1;
    }

    .tg-link {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(14, 18, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.65);
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .tg-link:hover {
      color: #ffffff;
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(37, 99, 235, 0.15);
      transform: scale(1.08);
    }

    .tg-link:active {
      transform: scale(0.94);
    }

    .tg-link svg {
      width: 24px;
      height: 24px;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div class="convex-overlay"></div>
  <div class="grain-overlay"></div>

  <div class="soon-wrapper">
    <div class="soon-text">Soon</div>
    <a class="tg-link" href="https://t.me/mxlaunchers" target="_blank" rel="noopener noreferrer" title="Telegram">
      <svg viewBox="0 0 24 24" fill="none">
        <path fill="currentColor" d="M16.906 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.062 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </svg>
    </a>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let dpr = window.devicePixelRatio || 1;
    let width = 0;
    let height = 0;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    let targetX = -500, targetY = -500;
    let currentX = -500, currentY = -500;
    let isHovered = false;
    let hoverAlpha = 0;

    let clickTime = -100;
    let isMouseDown = false;

    window.addEventListener('mousemove', (e) => {
      if (e.clientX >= 0 && e.clientX <= width && e.clientY >= 0 && e.clientY <= height) {
        targetX = e.clientX;
        targetY = e.clientY;
        if (!isHovered) {
          currentX = targetX;
          currentY = targetY;
          isHovered = true;
        }
      } else {
        isHovered = false;
      }
    });

    window.addEventListener('mouseenter', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
      currentX = targetX;
      currentY = targetY;
      isHovered = true;
    });

    document.addEventListener('mouseleave', () => {
      isHovered = false;
      isMouseDown = false;
    });

    window.addEventListener('blur', () => {
      isHovered = false;
      isMouseDown = false;
    });

    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isMouseDown = true;
        clickTime = performance.now() * 0.001;
      }
    });

    window.addEventListener('mouseup', () => {
      isMouseDown = false;
    });

    // touch support so the mobile version still gets the wavy glow
    window.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      targetX = t.clientX;
      targetY = t.clientY;
      currentX = targetX;
      currentY = targetY;
      isHovered = true;
      isMouseDown = true;
      clickTime = performance.now() * 0.001;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!t) return;
      targetX = t.clientX;
      targetY = t.clientY;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isHovered = false;
      isMouseDown = false;
    });

    function makeSimplex2D() {
      const perm = new Uint8Array(512);
      const p = new Uint8Array(256);
      for (let i = 0; i < 256; i++) p[i] = i;
      for (let i = 255; i > 0; i--) {
        const r = Math.floor(Math.random() * (i + 1));
        const t = p[i]; p[i] = p[r]; p[r] = t;
      }
      for (let i = 0; i < 512; i++) perm[i] = p[i & 255];

      function grad2(hash, x, y) {
        const h = hash & 7;
        const u = h < 4 ? x : y;
        const v = h < 4 ? y : x;
        return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
      }

      return function (x, y) {
        const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
        const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;
        let n0 = 0, n1 = 0, n2 = 0;
        const s = (x + y) * F2;
        const i = Math.floor(x + s);
        const j = Math.floor(y + s);
        const t = (i + j) * G2;
        const X0 = i - t;
        const Y0 = j - t;
        const x0 = x - X0;
        const y0 = y - Y0;
        let i1, j1;
        if (x0 > y0) { i1 = 1; j1 = 0; } else { i1 = 0; j1 = 1; }
        const x1 = x0 - i1 + G2;
        const y1 = y0 - j1 + G2;
        const x2 = x0 - 1.0 + 2.0 * G2;
        const y2 = y0 - 1.0 + 2.0 * G2;
        const ii = i & 255;
        const jj = j & 255;
        let t0 = 0.5 - x0 * x0 - y0 * y0;
        if (t0 >= 0) { t0 *= t0; n0 = t0 * t0 * grad2(perm[ii + perm[jj]], x0, y0); }
        let t1 = 0.5 - x1 * x1 - y1 * y1;
        if (t1 >= 0) { t1 *= t1; n1 = t1 * t1 * grad2(perm[ii + i1 + perm[jj + j1]], x1, y1); }
        let t2 = 0.5 - x2 * x2 - y2 * y2;
        if (t2 >= 0) { t2 *= t2; n2 = t2 * t2 * grad2(perm[ii + 1 + perm[jj + 1]], x2, y2); }
        return 70.0 * (n0 + n1 + n2);
      };
    }

    const simplex = makeSimplex2D();
    const CELL_SIZE = 8;
    const LEVELS = [-0.60, -0.25, 0.10, 0.45, 0.80];

    function draw(timestamp) {
      const t = timestamp * 0.000045;
      const waveT = timestamp * 0.001;

      ctx.clearRect(0, 0, width, height);

      ctx.fillStyle = '#0e1118';
      ctx.fillRect(0, 0, width, height);

      const ease = 0.2;
      currentX += (targetX - currentX) * ease;
      currentY += (targetY - currentY) * ease;

      const targetAlpha = isHovered ? 1.0 : 0.0;
      hoverAlpha += (targetAlpha - hoverAlpha) * 0.14;

      const cols = Math.ceil(width / CELL_SIZE) + 1;
      const rows = Math.ceil(height / CELL_SIZE) + 1;
      const field = new Float32Array(cols * rows);

      const noiseScale = 0.0058;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const px = c * CELL_SIZE;
          const py = r * CELL_SIZE;

          let mOffset = 0;
          if (hoverAlpha > 0.01) {
            const dx = px - currentX;
            const dy = py - currentY;
            const distSq = dx * dx + dy * dy;
            if (distSq < 6000) {
              const dist = Math.sqrt(distSq);
              const mDist = 1 - dist / 77.4;
              mOffset = Math.sin(dist * 0.10 - waveT * 2.5) * (0.28 * mDist * mDist * hoverAlpha);
            }
          }

          const v = simplex(px * noiseScale, py * noiseScale + t) +
            0.4 * simplex(px * noiseScale * 2.0 + 15, py * noiseScale * 2.0 + t * 1.3) +
            mOffset;
          field[r * cols + c] = v;
        }
      }

      function traceIsolines() {
        for (let l = 0; l < LEVELS.length; l++) {
          const threshold = LEVELS[l];
          for (let r = 0; r < rows - 1; r++) {
            for (let c = 0; c < cols - 1; c++) {
              const x = c * CELL_SIZE;
              const y = r * CELL_SIZE;

              const v0 = field[r * cols + c];
              const v1 = field[r * cols + (c + 1)];
              const v2 = field[(r + 1) * cols + (c + 1)];
              const v3 = field[(r + 1) * cols + c];

              const b0 = v0 >= threshold ? 1 : 0;
              const b1 = v1 >= threshold ? 2 : 0;
              const b2 = v2 >= threshold ? 4 : 0;
              const b3 = v3 >= threshold ? 8 : 0;
              const state = b0 | b1 | b2 | b3;

              if (state === 0 || state === 15) continue;

              function interp(valA, valB, posA, posB) {
                const delta = valB - valA;
                if (Math.abs(delta) < 1e-6) return (posA + posB) * 0.5;
                return posA + ((threshold - valA) / delta) * (posB - posA);
              }

              const topX = interp(v0, v1, x, x + CELL_SIZE), topY = y;
              const rightX = x + CELL_SIZE, rightY = interp(v1, v2, y, y + CELL_SIZE);
              const botX = interp(v3, v2, x, x + CELL_SIZE), botY = y + CELL_SIZE;
              const leftX = x, leftY = interp(v0, v3, y, y + CELL_SIZE);

              switch (state) {
                case 1: case 14:
                  ctx.moveTo(leftX, leftY); ctx.lineTo(topX, topY); break;
                case 2: case 13:
                  ctx.moveTo(topX, topY); ctx.lineTo(rightX, rightY); break;
                case 3: case 12:
                  ctx.moveTo(leftX, leftY); ctx.lineTo(rightX, rightY); break;
                case 4: case 11:
                  ctx.moveTo(rightX, rightY); ctx.lineTo(botX, botY); break;
                case 5:
                  ctx.moveTo(leftX, leftY); ctx.lineTo(topX, topY);
                  ctx.moveTo(rightX, rightY); ctx.lineTo(botX, botY); break;
                case 10:
                  ctx.moveTo(topX, topY); ctx.lineTo(rightX, rightY);
                  ctx.moveTo(leftX, leftY); ctx.lineTo(botX, botY); break;
                case 6: case 9:
                  ctx.moveTo(topX, topY); ctx.lineTo(botX, botY); break;
                case 7: case 8:
                  ctx.moveTo(leftX, leftY); ctx.lineTo(botX, botY); break;
              }
            }
          }
        }
      }

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.024)';
      ctx.lineWidth = 1;
      traceIsolines();
      ctx.stroke();

      function createWavyPath(centerX, centerY, radius, wobbleAmp, speedMult, phase) {
        const steps = 48;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const angle = (i / steps) * Math.PI * 2;
          const w1 = Math.sin(angle * 3 + waveT * 3.0 * speedMult + phase) * wobbleAmp;
          const w2 = Math.cos(angle * 5 - waveT * 2.2 * speedMult) * (wobbleAmp * 0.45);
          const r = Math.max(3, radius + w1 + w2);
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
      }

      if (hoverAlpha > 0.005) {
        const timeSinceClick = waveT - clickTime;
        let springScale = 1.0;
        let wobbleBoost = 1.0;

        if (timeSinceClick < 0.5) {
          const osc = Math.sin(timeSinceClick * 18) * Math.exp(-timeSinceClick * 6);
          springScale = 1.0 + osc * 0.22;
          wobbleBoost = 1.0 + Math.exp(-timeSinceClick * 5) * 1.5;
        } else if (isMouseDown) {
          springScale = 0.92;
        }

        const baseRadius = 34 * springScale;
        const outerRadius = baseRadius * 1.35;

        const outerGrad = ctx.createRadialGradient(
          currentX, currentY, 0,
          currentX, currentY, outerRadius
        );
        outerGrad.addColorStop(0, 'rgba(59, 130, 246, ' + (0.12 * hoverAlpha).toFixed(3) + ')');
        outerGrad.addColorStop(0.4, 'rgba(37, 99, 235, ' + (0.06 * hoverAlpha).toFixed(3) + ')');
        outerGrad.addColorStop(0.75, 'rgba(29, 78, 216, ' + (0.02 * hoverAlpha).toFixed(3) + ')');
        outerGrad.addColorStop(1, 'rgba(14, 17, 24, 0)');

        ctx.save();
        ctx.fillStyle = outerGrad;
        createWavyPath(currentX, currentY, baseRadius * 1.3, 5.5 * wobbleBoost, 0.7, Math.PI / 3);
        ctx.fill();
        ctx.restore();

        const midGrad = ctx.createRadialGradient(
          currentX, currentY, 0,
          currentX, currentY, baseRadius
        );
        midGrad.addColorStop(0, 'rgba(96, 165, 250, ' + (0.18 * hoverAlpha).toFixed(3) + ')');
        midGrad.addColorStop(0.5, 'rgba(59, 130, 246, ' + (0.10 * hoverAlpha).toFixed(3) + ')');
        midGrad.addColorStop(1, 'rgba(37, 99, 235, 0)');

        ctx.save();
        ctx.fillStyle = midGrad;
        createWavyPath(currentX, currentY, baseRadius, 4.0 * wobbleBoost, 1.0, 0);
        ctx.fill();
        ctx.restore();

        ctx.save();
        createWavyPath(currentX, currentY, baseRadius * 1.15, 3.2 * wobbleBoost, 1.0, 0);
        ctx.clip();
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(147, 197, 253, ' + (0.28 * hoverAlpha).toFixed(3) + ')';
        ctx.lineWidth = 1.2;
        traceIsolines();
        ctx.stroke();
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>

</html>
