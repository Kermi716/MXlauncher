<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXlauncher - Проект закрыт</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.02), transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .ambient-glow {
            position: absolute;
            top: 20vh;
            left: 50%;
            transform: translateX(-50%);
            width: 60vw;
            height: 60vh;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .header-logo {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .header-logo:hover {
            opacity: 1;
        }

        .header-logo img {
            height: 32px;
            width: auto;
            border-radius: 50%;
            filter: grayscale(100%);
        }

        .header-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .shutdown-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
            text-align: center;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .custom-emoji {
            margin-bottom: 24px;
            animation: bounceIn 1.2s cubic-bezier(0.28, 0.84, 0.42, 1) forwards;
            opacity: 0;
            transform: scale(0.3) translateY(40px);
            transform-origin: bottom center;
            cursor: pointer;
            display: inline-block;
        }

        .custom-emoji svg {
            width: 96px;
            height: 96px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .custom-emoji:hover svg {
            transform: scale(1.15) rotate(10deg);
        }

        .custom-emoji:active svg {
            transform: scale(0.95) rotate(-5deg);
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(40px) rotate(-15deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.1) translateY(-10px) rotate(5deg);
            }
            70% {
                transform: scale(0.95) translateY(5px) rotate(-2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotate(0deg);
            }
        }

        .shutdown-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(30px, 6vw, 65px);
            line-height: 1.1;
            letter-spacing: 2px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #71717a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 900px;
        }

        .shutdown-desc {
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(15px, 2vw, 18px);
            color: #71717a;
            margin-bottom: 60px;
            max-width: 600px;
            line-height: 1.5;
        }

        .stats-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px 40px;
            min-width: 240px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s, background 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border-hover);
        }

        .stat-value {
            font-family: 'Inter', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .site-footer {
            padding: 40px;
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(180deg, #e4e4e7 0%, #a1a1aa 100%);
            color: #09090b;
            padding: 14px 28px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid #a1a1aa;
            cursor: pointer;
            box-shadow: inset 0 2px 2px rgba(255, 255, 255, 1), 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(180deg, #f4f4f5 0%, #b4b4b8 100%);
            box-shadow: inset 0 2px 2px rgba(255, 255, 255, 1), 0 8px 25px rgba(255, 255, 255, 0.2);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            stroke: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .stat-card {
                width: 100%;
                padding: 24px;
            }
            .stat-value {
                font-size: 32px;
            }
        }
    </style>
</head>

</body>
</html>
